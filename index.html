<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شواطه AI">
<meta name="format-detection" content="telephone=no">
<meta name="apple-touch-fullscreen" content="yes">
<title>شواطه AI</title>
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    height: 100%;
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    position: fixed;
    inset: 0;
    width: 100%;
  }

  /* ===== الخلفية ===== */
  .bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: top center;
    z-index: 0;
  }
  .bg-overlay1 { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 1; }
  .bg-overlay2 {
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.1) 50%, rgba(0,0,0,.75));
  }

  /* ===== الحاوية ===== */
  .wrap {
    position: relative;
    z-index: 10;
    max-width: 672px;
    margin: 0 auto;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }

  .panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
  }

  @media (min-width: 640px) {
    .wrap { padding: 24px; }
    .panel {
      height: 100%;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.8);
    }
  }

  /* ===== الهيدر ===== */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.4);
    flex-shrink: 0;
  }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar {
    border-radius: 50%;
    object-fit: cover;
    object-position: top;
    display: block;
  }
  .avatar-lg { width: 44px; height: 44px; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .avatar-sm { width: 28px; height: 28px; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
  .online-dot {
    position: absolute;
    bottom: -2px;
    left: -2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 2px rgba(0,0,0,.8);
  }
  .header-info { flex: 1; min-width: 0; }
  .header-info h1 {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255,255,255,.6);
  }
  .status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #34d399;
  }
  .clear-btn {
    width: 44px; height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05);
    color: rgba(255,255,255,.7);
    cursor: pointer;
    touch-action: manipulation;
    transition: background .2s, color .2s, transform .15s;
  }
  .clear-btn:hover { background: rgba(255,255,255,.15); color: #fff; }
  .clear-btn:active { transform: scale(.9); }
  .clear-btn svg { width: 18px; height: 18px; }

  /* ===== الرسائل ===== */
  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.18) transparent;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 999px; }
  .messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.32); }

  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: pop .25s ease-out both;
  }
  .row.ai { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble {
    max-width: 85%;
    border-radius: 18px;
    padding: 11px 16px;
    font-size: 15px;
    line-height: 1.7;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.35);
    overflow-wrap: break-word;
    word-break: break-word;
    -webkit-hyphens: auto;
    hyphens: auto;
  }
  .bubble p { white-space: pre-wrap; }
  .bubble .time { display: block; margin-top: 4px; font-size: 10px; opacity: .45; }
  .bubble.ai {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.1);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .bubble.user {
    background: #fff;
    color: #000;
    border-bottom-left-radius: 6px;
  }
  .bubble.error {
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(248,113,113,.3);
    color: #fecaca;
  }

  /* ===== مؤشر الكتابة ===== */
  .dots { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
  .dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.8);
    animation: bounce .9s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: .35; }
    50%      { transform: translateY(-5px); opacity: 1; }
  }

  /* ===== الاقتراحات ===== */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 12px;
    flex-shrink: 0;
  }
  .chips.hidden { display: none; }
  .chip {
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.05);
    color: rgba(255,255,255,.85);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 16px;
    min-height: 36px;
    border-radius: 999px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .2s, color .2s, transform .15s;
  }
  .chip:hover { background: rgba(255,255,255,.15); color: #fff; }
  .chip:active { transform: scale(.95); }

  /* ===== الإدخال ===== */
  .input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.4);
    flex-shrink: 0;
  }
  .input-bar input {
    flex: 1;
    min-width: 0;
    height: 48px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.1);
    color: #fff;
    padding: 0 18px;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    touch-action: manipulation;
    transition: border-color .2s, background .2s;
  }
  .input-bar input::placeholder { color: rgba(255,255,255,.5); }
  .input-bar input:focus { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.15); }
  .send-btn {
    width: 48px; height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: #000;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .2s, transform .15s, opacity .2s;
  }
  .send-btn svg { width: 20px; height: 20px; transform: scaleX(-1); }
  .send-btn:hover:not(:disabled) { background: rgba(255,255,255,.9); }
  .send-btn:active:not(:disabled) { transform: scale(.9); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }

  .brand {
    text-align: center;
    font-size: 10px;
    letter-spacing: .025em;
    color: rgba(255,255,255,.35);
    background: rgba(0,0,0,.4);
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
  }

  /* ===== شاشات صغيرة جداً ===== */
  @media (max-width: 360px) {
    header { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); gap: 10px; }
    .avatar-lg { width: 38px; height: 38px; }
    .avatar-sm { width: 26px; height: 26px; }
    .header-info h1 { font-size: 16px; }
    .status { font-size: 11px; }
    .messages { padding: 12px 10px; gap: 10px; }
    .bubble { max-width: 88%; font-size: 14px; padding: 10px 14px; }
    .chips { padding: 0 10px 10px; gap: 6px; }
    .chip { font-size: 12px; padding: 8px 13px; }
    .input-bar { padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
    .input-bar input { height: 44px; font-size: 16px; padding: 0 14px; }
    .send-btn { width: 44px; height: 44px; }
  }

  /* ===== الوضع الأفقي ===== */
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
    .avatar-lg { width: 36px; height: 36px; }
    .header-info h1 { font-size: 16px; }
    .messages { padding: 12px 16px; }
    .input-bar { padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    .input-bar input { height: 40px; }
    .send-btn { width: 40px; height: 40px; }
    .brand { padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<div class="bg-overlay1" aria-hidden="true"></div>
<div class="bg-overlay2" aria-hidden="true"></div>

<div class="wrap">
  <section class="panel">
    <header>
      <div class="avatar-wrap">
        <img id="mainAvatar" alt="شواطه AI" class="avatar avatar-lg">
        <span class="online-dot"></span>
      </div>
      <div class="header-info">
        <h1>شواطه AI</h1>
        <p class="status"><span class="dot"></span> متصل الآن</p>
      </div>
      <button type="button" class="clear-btn" id="clearBtn" title="محادثة جديدة" aria-label="محادثة جديدة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </header>

    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="chips" id="chips"></div>

    <form class="input-bar" id="form">
      <input type="text" id="input" placeholder="اكتب رسالتك هنا..." autocomplete="off" maxlength="500" aria-label="رسالتك">
      <button type="submit" class="send-btn" id="sendBtn" aria-label="إرسال" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>
    </form>

    <div class="brand">شواطه AI • 8848 M</div>
  </section>
</div>

  // تعيين الصورة في كل الأماكن من نسخة واحدة
  document.querySelector(".bg").style.backgroundImage = 'url("' + BG + '")';
  document.getElementById("favicon").href = BG;
  document.getElementById("mainAvatar").src = BG;

  var KEY = "shawateh-ai-html-v1";
  var SUGGESTIONS = ["ازيك؟", "اسمك ايه؟", "احكيلي نكتة", "بتفكر في ايه؟"];

  var messagesEl = document.getElementById("messages");
  var chipsEl = document.getElementById("chips");
  var formEl = document.getElementById("form");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var clearBtn = document.getElementById("clearBtn");

  var messages = [];
  var loading = false;

  function nowTime() {
    return new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
  }
  function makeId() { return "m-" + Date.now() + "-" + Math.floor(Math.random() * 1e6); }

  function welcome() {
    return { id: "welcome", role: "ai", text: "أهلاً بيك! أنا شواطه AI، اسألني أي حاجة بالعربي وأنا هرود عليك.", time: nowTime() };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (Array.isArray(p) && p.length > 0) return p;
      }
    } catch (e) {}
    return [welcome()];
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(messages)); } catch (e) {}
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function avatarHtml() {
    return '<img src="' + BG + '" alt="شواطه AI" class="avatar avatar-sm">';
  }

  function render() {
    var html = "";
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      var cls = "bubble " + m.role + (m.error ? " error" : "");
      html += '<div class="row ' + m.role + '">'
        + (m.role === "ai" ? avatarHtml() : "")
        + '<div class="' + cls + '"><p>' + esc(m.text) + '</p><span class="time">' + esc(m.time) + '</span></div>'
        + '</div>';
    }
    if (loading) {
      html += '<div class="row ai" aria-label="شواطه AI بيكتب...">'
        + avatarHtml()
        + '<div class="bubble ai"><div class="dots"><span></span><span></span><span></span></div></div>'
        + '</div>';
    }
    messagesEl.innerHTML = html;

    if (messages.length <= 1 && !loading) {
      chipsEl.classList.remove("hidden");
      var chipsHtml = "";
      for (var j = 0; j < SUGGESTIONS.length; j++) {
        chipsHtml += '<button type="button" class="chip" data-q="' + esc(SUGGESTIONS[j]) + '">' + esc(SUGGESTIONS[j]) + '</button>';
      }
      chipsEl.innerHTML = chipsHtml;
    } else {
      chipsEl.classList.add("hidden");
      chipsEl.innerHTML = "";
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
    sendBtn.disabled = loading || inputEl.value.trim() === "";
  }

  function send(raw) {
    var text = (raw || "").trim();
    if (!text || loading) return;
    messages.push({ id: makeId(), role: "user", text: text, time: nowTime() });
    inputEl.value = "";
    loading = true;
    save();
    render();

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 20000);

    fetch(API + "?q=" + encodeURIComponent(text) + "&lang=ar", { signal: ctrl.signal })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var reply = (data && typeof data.message === "string" && data.message.trim() !== "") ? data.message : "!";
        messages.push({ id: makeId(), role: "ai", text: reply, time: nowTime() });
      })
      .catch(function () {
        messages.push({ id: makeId(), role: "ai", text: "حصلت مشكلة في الاتصال بالسيرفر، جرّب تاني بعد شوية.", time: nowTime(), error: true });
      })
      .then(function () {
        clearTimeout(timer);
        loading = false;
        save();
        render();
      });
  }

  formEl.addEventListener("submit", function (e) {
    e.preventDefault();
    send(inputEl.value);
  });

  inputEl.addEventListener("input", function () {
    sendBtn.disabled = loading || inputEl.value.trim() === "";
  });

  chipsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (btn) send(btn.getAttribute("data-q"));
  });

  clearBtn.addEventListener("click", function () {
    messages = [welcome()];
    save();
    render();
  });

  // ===== التعامل مع ظهور الكيبورد على الموبايل =====
  function handleViewportResize() {
    // مرّر للأسفل بعد تغيّر ارتفاع الـ viewport (ظهور/اختفاء الكيبورد)
    requestAnimationFrame(function () {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportResize);
  }

  // مرّر للأسفل عند التركيز على الإدخال (يظهر الكيبورد)
  inputEl.addEventListener('focus', function () {
    setTimeout(function () {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, 300);
  });

  // إرسال عند الضغط على Enter (بديل للـ submit على بعض المتصفحات)
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (inputEl.value.trim() && !loading) send(inputEl.value);
    }
  });

  // معالجة تغير اتجاه الشاشة (دوران الجهاز)
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, 200);
  });

  messages = load();
  render();
</script>
</body>
</html>
